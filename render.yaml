# Render Blueprint — https://render.com/docs/blueprint-spec
#
# In the Render dashboard: New -> Blueprint -> connect this GitHub repo.
# Render reads this file and provisions the database + web service automatically.
# See DEPLOY.md for the full walkthrough.

databases:
  - name: syncchat-db
    databaseName: syncchat
    user: syncchat
    plan: free

services:
  # ---- The live site everyone uses -------------------------------------
  - type: web
    name: syncchat
    runtime: node
    plan: free
    rootDir: random-chat
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: DATABASE_URL
        fromDatabase:
          name: syncchat-db
          property: connectionString
      # Optional Google sign-in — leave unset to just hide that button.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_BASE_URL
        value: https://syncchat.onrender.com
